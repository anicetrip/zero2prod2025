kind: pipeline
type: docker
name: zero2prod-ci

services:
  - name: postgres
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports:
      - 5432

steps:
  # --------------------------------------------
  # 等待 PostgreSQL 就绪
  # --------------------------------------------
  - name: wait-for-postgres
    image: postgres:16
    commands:
      - |
        echo "Waiting for PostgreSQL at postgres:5432..."
        for i in $(seq 1 60); do
          pg_isready -h postgres -p 5432 -U postgres && exit 0
          sleep 2
        done
        echo "Postgres not ready"
        exit 1

  # --------------------------------------------
  # 运行测试
  # --------------------------------------------
  - name: test
    image: rust:bookworm
    environment:
      DATABASE_URL: postgres://postgres:password@postgres:5432/newsletter_${DRONE_BUILD_NUMBER}
      APP_DATABASE__HOST: postgres
      APP_DATABASE__PORT: "5432"
      APP_DATABASE__USERNAME: postgres
      APP_DATABASE__PASSWORD: password
      APP_DATABASE__DATABASE_NAME: newsletter_${DRONE_BUILD_NUMBER}
      APP_DATABASE__REQUIRE_SSL: "false"
      SQLX_OFFLINE: "true"
    commands:
      - |
        apt-get update
        apt-get install -y postgresql-client

        echo "Creating test database..."
        export PGPASSWORD=password
        createdb -h postgres -U postgres newsletter_${DRONE_BUILD_NUMBER}

        echo "Installing sqlx-cli..."
        cargo install sqlx-cli --no-default-features --features postgres

        echo "Running migrations..."
        sqlx migrate run

        echo "Running tests..."
        cargo test --all --verbose
