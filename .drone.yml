kind: pipeline
type: docker
name: rust-ci

platform:
  os: linux
  arch: amd64

############################################
# PostgreSQL（测试数据库）
############################################
services:
  - name: postgres
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: newsletter
    ports:
      - 5432

############################################
# 全局缓存（需要 Trusted 仓库）
############################################
volumes:

  # Cargo 全局缓存
  - name: cargo-home
    host:
      path: /var/lib/drone/cargo

  # 编译产物缓存
  - name: cargo-target
    host:
      path: /var/lib/drone/target

  # sccache 编译缓存
  - name: sccache
    host:
      path: /var/lib/drone/sccache

  # 覆盖率报告
  - name: coverage
    host:
      path: /var/lib/drone/artifacts/coverage

############################################
# CI Steps
############################################
steps:

  ##########################################
  # 等待数据库启动
  ##########################################
  - name: wait-db
    image: postgres:16
    commands:
      - |
        echo "Waiting for PostgreSQL..."
        for i in $(seq 1 60); do
          pg_isready -h postgres -U postgres && exit 0
          sleep 2
        done
        echo "Postgres failed"
        exit 1

  ##########################################
  # Rust 测试 + 覆盖率（极速版）
  ##########################################
  - name: test-and-coverage
    image: xd009642/tarpaulin:latest
    privileged: true
    depends_on:
      - wait-db

    environment:
      # ========== Cargo ==========
      CARGO_HOME: /cargo
      CARGO_TARGET_DIR: /cargo-target

      # ========== sccache ==========
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: /sccache
      SCCACHE_CACHE_SIZE: 15G
      SCCACHE_IDLE_TIMEOUT: 0

      # ========== 数据库 ==========
      APP_DATABASE__HOST: postgres
      APP_DATABASE__PORT: "5432"
      APP_DATABASE__USERNAME: postgres
      APP_DATABASE__PASSWORD: 1234
      APP_DATABASE__DATABASE_NAME: newsletter
      APP_DATABASE__REQUIRE_SSL: "false"

      SQLX_OFFLINE: "true"

      COVERAGE_PREFIX: "coverage"

    volumes:
      - name: cargo-home
        path: /cargo

      - name: cargo-target
        path: /cargo-target

      - name: sccache
        path: /sccache

      - name: coverage
        path: /coverage

    commands:
      ###################################
      # 安装工具（首次运行会缓存）
      ###################################
      - echo "Installing sccache..."
      - cargo install sccache --locked || true

      ###################################
      # 启动 sccache
      ###################################
      - sccache --start-server || true
      - sccache --zero-stats || true

      ###################################
      # 清理陈旧锁（防止 CI 崩溃）
      ###################################
      - find /cargo-target -name ".package-lock" -delete || true
      - find /cargo/registry -name ".package-lock" -delete || true

      ###################################
      # 预下载依赖（命中缓存）
      ###################################
      - cargo fetch

      ###################################
      # 运行测试 & 覆盖率
      ###################################
      - cargo tarpaulin
        --skip-clean
        --workspace
        --all-features
        --target-dir /cargo-target
        --out Html
        --out Lcov

      ###################################
      # 保存覆盖率报告
      ###################################
      - BUILD_DIR=/coverage/${COVERAGE_PREFIX}-${DRONE_BUILD_NUMBER}
      - mkdir -p $BUILD_DIR
      - cp tarpaulin-report.html $BUILD_DIR/
      - cp lcov.info $BUILD_DIR/

      - rm -rf /coverage/${COVERAGE_PREFIX}-latest
      - cp -r $BUILD_DIR /coverage/${COVERAGE_PREFIX}-latest

      ###################################
      # 清理旧报告（仅保留最新）
      ###################################
      - cd /coverage
      - ls -1d ${COVERAGE_PREFIX}-* | sort -r | tail -n +2 | xargs rm -rf || true

      ###################################
      # 输出 sccache 统计
      ###################################
      - sccache --show-stats || true