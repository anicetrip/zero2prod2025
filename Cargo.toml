[package]
name = "zero2prod2025"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "zero2prod"


[dependencies]
actix-web = "4.12.1"
tokio = { version = "1.49.0", features = ["rt", "rt-multi-thread", "macros"] }
reqwest = "0.13.2"
serde = { version = "1.0.228", features = ["derive"] }
config = "0.15.19"
uuid = { version = "1", features = ["v4"] }

dotenvy = "0.15.7"

tracing = { version = "0.1.44", features = ["log"] }
tracing-subscriber = { version = "0.3.22", features = ["registry", "env-filter"] }
tracing-bunyan-formatter = "0.3.10"
tracing-log = "0.2.0"
once_cell = "1.21.3"
secrecy = { version = "0.10.3", features = ["serde"] }
chrono = "0.4.43"
serde-aux = "4"
unicode-segmentation = "1.12.0"
claims = "0.8"


[dependencies.sqlx]
version = "0.8.6"
default-features = false
features = [
    "runtime-tokio-rustls",
    "macros",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
]




