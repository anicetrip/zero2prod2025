[package]
name = "zero2prod2025"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "zero2prod"


[dependencies]
actix-web = "4.12.1"
tokio = { version = "1.49.0", features = ["rt", "rt-multi-thread", "macros"] }
reqwest = "0.13.1"
serde = { version = "1.0.228", features = ["derive"] }
config = "0.15.19"

