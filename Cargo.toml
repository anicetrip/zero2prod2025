[package]
name = "zero2prod2025"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "zero2prod"


[dependencies]
actix-web = "4.13.0"
tokio = { version = "1.52.1", features = ["rt", "rt-multi-thread", "macros"] }

serde = { version = "1.0.228", features = ["derive"] }
config = "0.15.22"
uuid = { version = "1.23.1", features = ["v4"] }

dotenvy = "0.15.7"

tracing = { version = "0.1.44", features = ["log"] }
tracing-subscriber = { version = "0.3.23", features = [
    "registry",
    "env-filter",
] }
tracing-bunyan-formatter = "0.3.10"
tracing-log = "0.2.0"
once_cell = "1.21.4"
secrecy = { version = "0.10.3", features = ["serde"] }
chrono = "0.4.44"
serde-aux = "4"
unicode-segmentation = "1.13.2"
claims = "0.8"
validator = "0.20.0"
fake = "5.1.0"
tracing-actix-web = "0.7.21"
url = { version = "2.5.8", features = ["serde"] }
rand = { version = "0.10", features=["std_rng"] }
thiserror = "2.0.18"
anyhow = "1.0.102"

[dependencies.sqlx]
version = "0.8.6"
default-features = false
features = [
    "runtime-tokio-rustls",
    "macros",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
]

[dependencies.reqwest]
version = "0.13.2"
default-features = false
# We need the `json` feature flag to serialize/deserialize JSON payloads
features = ["json", "rustls"]

[dev-dependencies]
# [...]
quickcheck = "1.1.0"
quickcheck_macros = "1.2.0"
tokio = { version = "1.52.1", features = ["rt", "macros"] }
wiremock = "0.6.5"
serde_json = "1.0.149"
linkify = "0.11.0"
